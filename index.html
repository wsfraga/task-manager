<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <section class="task-manager">

    <div class="header-task-manager">
      <h1 class="task-title">Task Manager</h1>
      <p class="task-content">Organize suas tarefas e seja mais produtivo</p>
    </div>

    <div class="task-new">
      <input type="text" id="task" placeholder="Digite uma tarefa..." data-task="task-new">

      <button class="task-add" data-task="task-add">
        <img src="assets/img/icon/add.svg">
        Adicionar
      </button>
    </div>

    <div class="task">

      <div class="task-bar">
        <h2 class="task-amount">
          Suas tarefas
          <span>( 0 )</span>
        </h2>

        <div class="task-bar-filter">
          <label for="task-filter">Filtrar:</label>

          <select name="task-step" id="task-filter">
            <option class="task-filter-tem" value="all">Todas</option>
            <option class="task-filter-tem" value="completed">Concluídas</option>
            <option class="task-filter-tem" value="pending">Pendentes</option>
          </select>
        </div>
      </div>

      <div class="task-container">
        <ul class="task-list" data-task="task-list"></ul>
      </div>
    </div>

    <div class="task-footer">
        <ul class="task-list-step">
          <li class="task-list-total">
            <p>Total:
              <span>0</span>
            </p>
          </li>
          <li class="task-list-completed">
            <p>Concluido:
              <span>0</span>
            </p>
          </li>
          <li class="task-list-pending">
            <p>Pendente:
              <span>0</span>
            </p>
          </li>
        </ul>
      </div>
  </section>

  <script type="module" src="assets/js/main.js"></script>
</body>

</html>
